<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WH40K Terrain Layout</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="stage">
    <main id="sheet" class="app-sheet" width="768" height="1080" aria-label="Terrain Layout">
      <header class="masthead">
        <h1>
          <button id="terrain-rules-button" class="title-button" type="button">Terrain Layout</button>
        </h1>
        <div class="masthead-tools">
          <div id="language-toggle" class="language-toggle" role="group" aria-label="Language">
            <button type="button" data-lang="ru">RU</button>
            <button type="button" data-lang="en">ENG</button>
          </div>
          <button id="layout-key-button" class="icon-button" type="button" aria-label="Open layouts key" title="Open layouts key">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M4 5h16v14H4z" fill="none" stroke="currentColor" stroke-width="2"/>
              <path d="M8 9h8M8 13h8M8 17h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </header>

      <section class="matchup" aria-label="Force disposition matchup">
        <article class="selector-card">
          <img id="left-icon" class="disposition-icon" alt="">
          <span class="card-kicker">Force Disposition</span>
          <select id="left" hidden tabindex="-1" aria-hidden="true"></select>
          <button
            id="left-disposition-button"
            class="disposition-button"
            type="button"
            aria-controls="disposition-menu"
            aria-expanded="false"
          ></button>
          <hr>
          <span class="mission-label">Mission</span>
          <button
            id="left-mission"
            class="mission-summary-trigger"
            type="button"
            aria-controls="mission-popover"
            aria-expanded="false"
            data-side="left"
          ></button>
        </article>

        <b class="versus" aria-hidden="true">VS</b>

        <article class="selector-card">
          <img id="right-icon" class="disposition-icon" alt="">
          <span class="card-kicker">Force Disposition</span>
          <select id="right" hidden tabindex="-1" aria-hidden="true"></select>
          <button
            id="right-disposition-button"
            class="disposition-button"
            type="button"
            aria-controls="disposition-menu"
            aria-expanded="false"
          ></button>
          <hr>
          <span class="mission-label">Mission</span>
          <button
            id="right-mission"
            class="mission-summary-trigger"
            type="button"
            aria-controls="mission-popover"
            aria-expanded="false"
            data-side="right"
          ></button>
        </article>

        <button id="twist-button" class="twist-button" type="button" aria-controls="twist-dialog" aria-pressed="false">
          <svg class="twist-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path d="M4 7h10a4 4 0 0 1 4 4v6M14 3l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20 17H10a4 4 0 0 1-4-4V7M10 21l-4-4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="twist-button-label" class="visually-hidden">No Twist</span>
        </button>
      </section>

      <div class="layouts" role="group" aria-label="Terrain layout">
        <button type="button" data-layout="A" aria-pressed="true">A</button>
        <button type="button" data-layout="B" aria-pressed="false">B</button>
        <button type="button" data-layout="C" aria-pressed="false">C</button>
        <button id="free-layout-button" type="button" aria-pressed="false" aria-label="Choose any layout">+</button>
      </div>

      <section class="map-panel" aria-labelledby="layout-title">
        <h2 id="layout-title">Layout A</h2>
        <button class="map-button" type="button" aria-label="Open layout at full size">
          <img id="map" alt="" aria-describedby="map-description">
        </button>
        <p id="map-description" class="visually-hidden">Official terrain placement diagram. Terrain footprints, objective positions and exact edge measurements are printed in the image.</p>
        <p id="error" role="alert" hidden></p>
      </section>
    </main>
  </div>

  <div id="disposition-menu" class="disposition-menu" popover="manual" hidden></div>
  <div id="mission-popover" class="mission-popover" popover="manual" role="region" tabindex="0" aria-labelledby="mission-popover-title" hidden></div>

  <dialog id="twist-dialog" aria-labelledby="twist-dialog-title">
    <header>
      <h2 id="twist-dialog-title">Twist</h2>
      <button id="twist-dialog-close" class="dialog-close" type="button" aria-label="Close" title="Close">×</button>
    </header>
    <div id="twist-dialog-body"></div>
    <footer id="twist-dialog-footer"></footer>
  </dialog>

  <dialog id="terrain-rules-viewer" aria-labelledby="terrain-rules-title">
    <header>
      <h2 id="terrain-rules-title">Terrain Layouts</h2>
      <button id="terrain-rules-close" class="dialog-close" type="button" aria-label="Close" title="Close">×</button>
    </header>
    <img id="terrain-rules-image" src="assets/key/terrain-rules.webp" alt="Official terrain layouts rules and recommended terrain area footprints">
  </dialog>

  <dialog id="layout-key-viewer" aria-labelledby="layout-key-title">
    <header>
      <h2 id="layout-key-title">Layouts Key</h2>
      <button id="layout-key-close" class="dialog-close" type="button" aria-label="Close" title="Close">×</button>
    </header>
    <img id="layout-key-image" src="assets/key/layouts-key.webp" alt="Official layouts key">
  </dialog>

  <dialog id="viewer" aria-labelledby="viewer-title">
    <header>
      <h2 id="viewer-title">Layout A</h2>
      <button id="close" class="dialog-close" type="button" aria-label="Close" title="Close">×</button>
    </header>
    <img id="large-map" alt="" aria-describedby="map-description">
  </dialog>

  <dialog id="layout-gallery" class="layout-gallery" aria-labelledby="layout-gallery-title">
    <header>
      <h2 id="layout-gallery-title">All layouts</h2>
      <button id="layout-gallery-close" class="dialog-close" type="button" aria-label="Close" title="Close">×</button>
    </header>
    <div id="layout-gallery-scroll" class="layout-gallery-scroll"></div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
